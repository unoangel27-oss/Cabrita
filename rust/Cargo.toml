[package]
name = "cabrita"
version = "0.1.0"
edition = "2021"
description = "Runtime y herramientas del formato UKJ (Cabrita)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
half = "2.7"
memmap2 = "0.9"
rayon = "1.12"
fancy-regex = "0.20"
rand = "0.9"
libc = "0.2"
wgpu = "0.19"
pollster = "0.3"
bytemuck = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
