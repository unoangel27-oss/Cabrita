[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ukj-convert"
version = "0.1.0"
description = "Conversor GGUF → UKJ v1 (Cabrita)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Equipo UKJ/Cabrita" }]

[project.scripts]
ukj-convert = "ukj_convert.cli:main"

[tool.setuptools]
packages = ["ukj_convert"]
